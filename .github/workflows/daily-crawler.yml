name: CI & Daily Bank SOC Crawler

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Runs at 20:00 UTC (02:00 BST Bangladesh Standard Time) every day
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck and lint
        run: npm run lint

      - name: Run unit and invariant tests
        run: npm test

      - name: Build Next.js application
        run: npm run build

  crawl-and-sync:
    runs-on: ubuntu-latest
    needs: validate-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pinned crawler dependencies
        run: |
          pip install --require-hashes -r requirements.txt || pip install -r requirements.txt

      - name: Run crawler with local persistence and audit export
        run: |
          python -m py_compile scripts/soc_crawler.py
          python scripts/soc_crawler.py --audit --workers 8 --output crawl_audit_latest.json --apply-local

      - name: Push verified rates to live production API
        if: env.RATES_SYNC_SECRET != ''
        env:
          RATES_SYNC_SECRET: ${{ secrets.RATES_SYNC_SECRET }}
        run: |
          python scripts/soc_crawler.py --sync-api https://api.fardinanik.com/api/v1/rates/sync --sync-secret "$RATES_SYNC_SECRET"

      - name: Commit and push updated dataset if rates changed
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain src/data/bangladesh_61_banks.json)" ]; then
            git add src/data/bangladesh_61_banks.json
            git commit -m "chore(data): auto-update 61 bank rates and SOC audit [skip ci]"
            git push
          else
            echo "No rate changes detected today."
          fi

      - name: Upload Audit Artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: daily-bank-rates-audit
          path: crawl_audit_latest.json
          retention-days: 14
