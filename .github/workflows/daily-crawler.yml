name: CI & Daily Bank SOC Crawler

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Runs at 20:00 UTC (02:00 BST Bangladesh Standard Time) every day
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck and lint
        run: npm run lint

      - name: Run unit and invariant tests
        run: npm test

      - name: Build Next.js application
        run: npm run build

  crawl-and-audit:
    runs-on: ubuntu-latest
    needs: validate-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pinned crawler dependencies
        run: |
          pip install --require-hashes -r requirements.txt || pip install -r requirements.txt

      - name: Compile and audit crawler
        run: |
          python -m py_compile scripts/soc_crawler.py
          python scripts/soc_crawler.py --audit --workers 8 --output crawl_audit_latest.json

      - name: Upload Audit Artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: daily-bank-rates-audit
          path: crawl_audit_latest.json
          retention-days: 14
